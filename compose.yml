services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  test:
    build: .
    working_dir: /app
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solidus_mcp_test
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bin/ci"]
volumes:
  bundle:
